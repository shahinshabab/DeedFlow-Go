name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deedflow
          POSTGRES_USER: deedflow
          POSTGRES_PASSWORD: deedflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deedflow -d deedflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://deedflow:deedflow@127.0.0.1:5432/deedflow?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Tesseract and poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
