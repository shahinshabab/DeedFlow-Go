name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, deedflow]
    steps:
      - uses: actions/checkout@v4

      # The production .env lives only on the server, never in the repo.
      - name: Load production .env
        run: cp /home/ubuntu/deedflow/.env .env

      - name: Build and start
        run: docker compose -p deedflow -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Wait for web
        run: |
          for i in $(seq 1 30); do
            if docker compose -p deedflow -f docker-compose.yml -f docker-compose.prod.yml exec -T web \
                curl -fsS -o /dev/null http://localhost:8000/login/ 2>/dev/null; then
              echo "web is up"; exit 0
            fi
            sleep 5
          done
          docker compose -p deedflow -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 web
          exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -f
